plugins {
    id 'com.android.application'
}

android {
    namespace 'com.matziq.teslamatemobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.matziq.teslamatemobile'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            if (System.getenv('MOBILE_KEYSTORE')) {
                storeFile file(System.getenv('MOBILE_KEYSTORE'))
                storePassword System.getenv('MOBILE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('MOBILE_KEY_ALIAS')
                keyPassword System.getenv('MOBILE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}
